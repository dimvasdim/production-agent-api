[project]
name = "production-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vasilis", email = "35334907+dimvasdim@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.156.8",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
production-api = "app:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
